appId: com.electron.app
productName: zonecodex
afterPack: scripts/build-windows-command-runtime.mjs
afterSign: scripts/build-windows-command-runtime.mjs
directories:
  buildResources: build
files:
  - out/**
  - '!out/cli/**'
  - package.json
  - resources/icon.png
win:
  executableName: zonecodex
  # Keep official signatures and host build bytes; main app/installer signing stays enabled.
  signExts:
    - '!windows-command-runtime\host.exe'
    - '!windows-command-runtime/host.exe'
    - '!windows-command-runtime\codex.exe'
    - '!windows-command-runtime/codex.exe'
    - '!windows-command-runtime\codex-command-runner.exe'
    - '!windows-command-runtime/codex-command-runner.exe'
    - '!windows-command-runtime\codex-windows-sandbox-setup.exe'
    - '!windows-command-runtime/codex-windows-sandbox-setup.exe'
  extraResources:
    - from: resources/windows-command-runtime
      to: windows-command-runtime
      filter:
        - host.exe
        - codex.exe
        - codex-command-runner.exe
        - codex-windows-sandbox-setup.exe
        - manifest.json
        - LICENSE
        - THIRD_PARTY_NOTICES.txt
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
